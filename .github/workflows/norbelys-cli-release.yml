# Native release workflow based on cargo-dist: https://axodotdev.github.io/cargo-dist
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# Native CLI packaging from an immutable version tag. GitHub assets are verified and
# copied to R2 by the private Terraform workflow. PRs produce a packaging plan only.
on:
  pull_request:
    paths:
      [
        "crates/cli/**",
        "crates/server/openapi.json",
        "Cargo.lock",
        "dist-workspace.toml",
      ]
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable norbelys-cli-vX.Y.Z tag
        type: string
        required: true
  push:
    tags:
      - "norbelys-cli**[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: cli-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/backend.yml
    with:
      mode: cli
      ref: ${{ inputs.tag || github.ref }}

  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    needs: checks
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && (inputs.tag || github.ref_name) || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', (inputs.tag || github.ref_name)) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.tag || github.ref }}
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - &install-dist
        name: Install checksum-pinned official dist binary
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s):$(uname -m)" in
            Darwin:arm64) target=aarch64-apple-darwin ;;
            Darwin:x86_64) target=x86_64-apple-darwin ;;
            Linux:aarch64) target=aarch64-unknown-linux-gnu ;;
            Linux:x86_64) target=x86_64-unknown-linux-gnu ;;
            MINGW*:x86_64|MSYS*:x86_64) target=x86_64-pc-windows-msvc ;;
            *) echo "Unsupported release tool platform" >&2; exit 1 ;;
          esac
          extension=tar.xz
          binary=dist
          if [[ "$target" == *windows* ]]; then extension=zip; binary=dist.exe; fi
          archive="cargo-dist-$target.$extension"
          case "$archive" in
            cargo-dist-aarch64-apple-darwin.tar.xz) expected=7b3cbe25511de01d74c0f5fcb7909edabd379bea9cfa284d93af5a3cdfa3247c ;;
            cargo-dist-aarch64-unknown-linux-gnu.tar.xz) expected=9c554ab21a58ad46eb9b6710f89633ccb26bc2577cf4b0c2d18a5b826a31913e ;;
            cargo-dist-aarch64-unknown-linux-musl.tar.xz) expected=4761cff5fc547ad66d1449abbf321380b0e6bd8093b1fe6593852a3314fd0c19 ;;
            cargo-dist-x86_64-apple-darwin.tar.xz) expected=6a49bfb61bd86770d79c27f3d2b40c6b2e71cde940d3d31a6ccaaffc124d7a29 ;;
            cargo-dist-x86_64-pc-windows-msvc.zip) expected=9a36d70795e14326a5ec4bf17aee085df00ab85a322739291ea5d4b1b5f693cd ;;
            cargo-dist-x86_64-unknown-linux-gnu.tar.xz) expected=4b3f0a5f0ebbdb798f6db649d01b32ba1518376b6f7a0502b7d92b75cc2c8293 ;;
            cargo-dist-x86_64-unknown-linux-musl.tar.xz) expected=b8e95bc76c63375958173ef5ae2dbd8e9211cc1ed03cdee0899702766b4c2a2e ;;
            *) exit 1 ;;
          esac
          directory=$(mktemp -d)
          trap 'rm -rf "$directory"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/$archive" \
            --output "$directory/$archive"
          if command -v sha256sum >/dev/null; then
            actual=$(sha256sum "$directory/$archive")
          else
            actual=$(shasum -a 256 "$directory/$archive")
          fi
          [[ "${actual%% *}" == "$expected" ]] || { echo "dist checksum mismatch" >&2; exit 1; }
          if [[ "$extension" == zip ]]; then
            unzip -q "$directory/$archive" -d "$directory"
            executable="$directory/$binary"
          else
            tar -xJf "$directory/$archive" -C "$directory"
            executable="$directory/cargo-dist-$target/$binary"
          fi
          mkdir -p "$HOME/.cargo/bin"
          cp "$executable" "$HOME/.cargo/bin/$binary"
          chmod +x "$HOME/.cargo/bin/$binary"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/$binary" --version | grep -Fx 'cargo-dist 0.33.0'
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          retention-days: 1
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        env:
          RELEASE_TAG: ${{ !github.event.pull_request && (inputs.tag || github.ref_name) || '' }}
        run: |
          args=()
          if [ -n "$RELEASE_TAG" ]; then
            [[ "$RELEASE_TAG" =~ ^norbelys-cli-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
            args+=("--tag=$RELEASE_TAG")
          fi
          dist plan "${args[@]}" --output-format=json > plan-dist-manifest.json
          echo "manifest=$(jq -c '.' plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          retention-days: 1
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build native archives on each target runner.
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            bash .github/scripts/install-rustup.sh
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - *install-dist
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cli-${{ join(matrix.targets, '-') }}
      - name: Test CLI against loopback mock servers
        run: cargo test --locked -p norbelys-cli
      - name: Build artifacts
        run: |
          # Package archives for this runner's target.
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # Export newline-delimited artifact paths for the upload action.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          retention-days: 1
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Generate installers and checksums after native archives.
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.tag || github.ref }}
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          retention-days: 1
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    permissions:
      contents: write
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.tag || github.ref }}
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # Overwrite the previous copy
          retention-days: 1
          name: artifacts-dist-manifest
          overwrite: true
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Publish immutable CLI assets
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_TAG: "${{ needs.plan.outputs.tag }}"
        run: |
          bun .github/scripts/publish-cli.mjs
