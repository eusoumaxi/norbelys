name: Python SDK
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a verified Python SDK tag to PyPI
        type: boolean
        default: false
      tag:
        description: Immutable python-vX.Y.Z release tag
        type: string
permissions:
  contents: read
jobs:
  check:
    env:
      UV_PYTHON: ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-scope: python-${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.12.23
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --package norbelys
      - run: bunx turbo run drift lint typecheck coverage build --filter=norbelys
      - name: Verify the wheel can be installed without the source tree
        run: |
          uv venv "$RUNNER_TEMP/sdk-wheel"
          uv pip install --python "$RUNNER_TEMP/sdk-wheel/bin/python" sdks/python/dist/*.whl
          cd "$RUNNER_TEMP"
          sdk-wheel/bin/python -c 'from norbelys import Norbelys, AsyncNorbelys; Norbelys(api_key="ak_ci").close()'
  publish:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/tags/{0}', inputs.tag) && startsWith(inputs.tag, 'python-v')
    runs-on: ubuntu-24.04
    environment: pypi
    env:
      UV_PYTHON: "3.11"
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-scope: python-3.11
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.12.23
          python-version: "3.11"
          enable-cache: true
      - name: Verify the tag version and build the package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          uv run --frozen --package norbelys python -c 'import os, tomllib; v=tomllib.load(open("sdks/python/pyproject.toml","rb"))["project"]["version"]; assert os.environ["TAG"] == "python-v"+v'
          bunx turbo run drift lint typecheck coverage build --filter=norbelys
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: sdks/python/dist
          # Terraform supplies the token for initial publication; omit it for trusted publishing.
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: ${{ secrets.PYPI_API_TOKEN == '' }}
