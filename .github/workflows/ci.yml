name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Fresh advisories can affect unchanged dependencies; audit weekly without builds.
    - cron: "17 8 * * 1"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'dependency-audit' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      backend_mode: ${{ steps.scope.outputs.backend_mode }}
      typescript: ${{ steps.scope.outputs.typescript }}
      python: ${{ steps.scope.outputs.python }}
      frontends: ${{ steps.scope.outputs.frontends }}
      audits: ${{ steps.scope.outputs.audits }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - id: scope
        run: bun .github/scripts/check-scope.mjs
      - uses: ./.github/actions/setup
        if: steps.scope.outputs.tooling == 'true' || steps.scope.outputs.javascript == 'true'
      - run: bunx turbo run typecheck:tools type-coverage:tools
        if: steps.scope.outputs.tooling == 'true'
      - run: bun run lint:javascript
        if: steps.scope.outputs.javascript == 'true'
      - run: bun test ./.github/scripts
        if: steps.scope.outputs.tooling == 'true'
      - name: Summarize the selected checks
        env:
          SELECTION: ${{ toJSON(steps.scope.outputs) }}
        run: printf '%s\n' "$SELECTION" >> "$GITHUB_STEP_SUMMARY"
      - name: Record affected images for publication after CI succeeds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_SCOPE_PATH: ${{ runner.temp }}/release-scope.json
        run: bun .github/scripts/release-scope.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-scope
          path: ${{ runner.temp }}/release-scope.json
          retention-days: 7
          if-no-files-found: error
  dependency-security:
    needs: scope
    if: needs.scope.outputs.audits != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ecosystem: ${{ fromJSON(needs.scope.outputs.audits) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: matrix.ecosystem == 'javascript'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        if: matrix.ecosystem == 'python'
        with:
          version: 0.12.23
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: bun run audit:javascript
        if: matrix.ecosystem == 'javascript'
      - name: Audit the pinned Python dependencies
        if: matrix.ecosystem == 'python'
        run: |
          uv export --frozen --quiet --all-packages --all-groups --no-emit-workspace --output-file "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --require-hashes --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"
      - name: Install the Rust toolchain
        if: matrix.ecosystem == 'rust'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: matrix.ecosystem == 'rust'
        with:
          prefix-key: v1-rust
          shared-key: dependency-audit
          cache-targets: false
      - name: Audit the pinned Rust dependencies
        if: matrix.ecosystem == 'rust'
        run: |
          cargo install --locked cargo-deny@0.20.2
          cargo deny check
  backend:
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    uses: ./.github/workflows/backend.yml
    with:
      mode: ${{ needs.scope.outputs.backend_mode }}
  typescript:
    permissions:
      contents: read
      id-token: write
    needs: scope
    if: needs.scope.outputs.typescript == 'true'
    uses: ./.github/workflows/sdk.yml
  python:
    permissions:
      contents: read
      id-token: write
    needs: scope
    if: needs.scope.outputs.python == 'true'
    uses: ./.github/workflows/python.yml
  frontend:
    needs: scope
    if: needs.scope.outputs.frontends != '[]'
    uses: ./.github/workflows/frontend.yml
    with:
      apps: ${{ needs.scope.outputs.frontends }}
  required:
    name: Required checks
    if: always()
    needs: [scope, dependency-security, backend, typescript, python, frontend]
    runs-on: ubuntu-24.04
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - run: |
          printf '%s' "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
