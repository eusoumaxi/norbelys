# After the exact main-push CI run succeeds, build the images its changes need for
# linux/amd64, pushes them to GHCR as sha-<commit> with an SBOM and maximal provenance, and sends
# their digests to the private Terraform release workflow, which uses the installed host protocol
# and digest-only references. The collector image (docker/collector/) is built
# when its own inputs change, or on a manual run. CI records only a JSON image selection;
# no tests or coverage are repeated here and no executable artifact is consumed.
#
# Repository settings: INFRA_REPOSITORY (owner/name) as a variable and INFRA_DISPATCH_TOKEN as a
# secret scoped to that repository alone (a fine-grained token with Contents write, to send a
# repository_dispatch). Dispatch also requires AUTO_RELEASE_ENABLED=true; false or unset keeps
# rollout manual. Without dispatch, images are still built and their digests summarised.
name: Images
run-name: Images ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    name: Images to build
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      images: ${{ steps.scope.outputs.images }}
      any: ${{ steps.scope.outputs.any }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Verify the latest main CI run for this exact source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&branch=main&event=push&per_page=1" |
            jq -e --arg sha "$SOURCE_SHA" --arg repository "$GITHUB_REPOSITORY" '.workflow_runs[0] | .head_sha == $sha and .head_branch == "main" and .event == "push" and .head_repository.full_name == $repository and .conclusion == "success"'
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Read this CI run's image selection
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-scope
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-scope
      - id: scope
        name: Validate the selection (manual runs build all images)
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_SCOPE_PATH: ${{ github.event_name == 'workflow_run' && format('{0}/release-scope/release-scope.json', runner.temp) || '' }}
        run: bun .github/scripts/release-scope.mjs

  image:
    name: Image ${{ matrix.image }}
    needs: scope
    if: needs.scope.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.scope.outputs.images) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.source_sha }}
          persist-credentials: false

      - name: Name the image
        id: name
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Restore compiler cache mounts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .buildkit-cache
          key: buildkit-${{ runner.os }}-${{ matrix.image }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'bun.lock', 'docker/collector/builder.yaml') }}-${{ needs.scope.outputs.source_sha }}
          restore-keys: buildkit-${{ runner.os }}-${{ matrix.image }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'bun.lock', 'docker/collector/builder.yaml') }}-
      - name: Inject and persist compiler caches
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          cache-map: |
            {".buildkit-cache/registry":{"target":"/usr/local/cargo/registry","id":"cargo-registry"},".buildkit-cache/target":{"target":"/src/target","id":"target-${{ matrix.image }}"},".buildkit-cache/go-mod":"/root/go/pkg/mod",".buildkit-cache/go-build":"/root/.cache/go-build",".buildkit-cache/bun":{"target":"/root/.bun/install/cache","id":"bun-install"}}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The installation uses linux/amd64; add linux/arm64 when ARM hosts are managed.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image == 'collector' && 'docker/collector' || '.' }}
          file: ${{ matrix.image == 'collector' && 'docker/collector/Dockerfile' || matrix.image == 'app' && 'apps/app/Dockerfile' || 'Dockerfile' }}
          target: ${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.repository }}:sha-${{ needs.scope.outputs.source_sha }}
            ${{ steps.name.outputs.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.scope.outputs.source_sha }}
            org.opencontainers.image.licenses=Apache-2.0
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Record the digest
        env:
          IMAGE: ${{ matrix.image }}
          REFERENCE: ${{ steps.name.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s' "$REFERENCE" > "digests/$IMAGE"
          echo "- \`$IMAGE\`: \`$REFERENCE\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          retention-days: 90

  publish:
    name: Send the digests to the infrastructure repository
    needs: [scope, image]
    if: github.ref == 'refs/heads/main' && vars.AUTO_RELEASE_ENABLED == 'true' && vars.INFRA_REPOSITORY != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Dispatch backend-published
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          INFRA_REPOSITORY: ${{ vars.INFRA_REPOSITORY }}
          SOURCE_SHA: ${{ needs.scope.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::INFRA_DISPATCH_TOKEN is missing"; exit 1; }
          [[ $INFRA_REPOSITORY =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          images=$(cd digests && for file in *; do jq -n --arg image "$file" --rawfile reference "$file" '{($image): $reference}'; done | jq -s 'add // {}')
          # Only prepared host roles can roll out. Frontend updates use their own Terraform root.
          images=$(printf '%s' "$images" | jq 'with_entries(select(.key == "server" or .key == "server-analytics"))')
          if [ "$images" = '{}' ]; then exit 0; fi
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" --argjson images "$images" \
            '{event_type: "backend-published", client_payload: {source_repository: $repository, source_sha: $sha, images: $images}}' \
            > "$RUNNER_TEMP/release.json"
          gh api --method POST "repos/$INFRA_REPOSITORY/dispatches" --input "$RUNNER_TEMP/release.json"
