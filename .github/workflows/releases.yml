# Version changes are reviewed source commits. Immutable version tags trigger the package
# workflows directly; this entry point retries publication of an existing tag without
# generating version commits, branches or pull requests.
name: Package releases
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing typescript-vX.Y.Z, python-vX.Y.Z or norbelys-cli-vX.Y.Z tag
        type: string
        required: true
permissions:
  contents: read
  actions: write
concurrency:
  group: package-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish the selected immutable version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(typescript|python|norbelys-cli)-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /dev/null
          case "$RELEASE_TAG" in
            typescript-*) gh workflow run sdk.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" -f publish=true -f tag="$RELEASE_TAG" ;;
            python-*) gh workflow run python.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" -f publish=true -f tag="$RELEASE_TAG" ;;
            norbelys-cli-*) gh workflow run norbelys-cli-release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" -f tag="$RELEASE_TAG" ;;
          esac
