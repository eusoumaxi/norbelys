[workspace]
members = ["cargo:."]

# Only the HTTP CLI is distributed. Server binaries are released as separate OCI images.
[dist]
cargo-dist-version = "0.33.0"
# Platform packaging must not compile server, SMTP or maintenance binaries.
precise-builds = true
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
hosting = ["simple", "github"]
simple-download-url = "https://cli.norbelys.com/releases/{tag}"
tag-namespace = "norbelys-cli"
install-path = "CARGO_HOME"
pr-run-mode = "plan"
# CI adds checked-tag dispatch and CLI tests to the packaging workflow.
allow-dirty = ["ci"]

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
