[package]
name = "norbelys-smtp"
description = "The control plane of the managed MTA: control API, provisioning helper, log collector and evidence outbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "norbelys-smtp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
hickory-resolver.workspace = true
jiff.workspace = true
norbelys-mail.workspace = true
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-prometheus.workspace = true
prometheus.workspace = true
uuid.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
rusqlite.workspace = true
rustix.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
# The DKIM signer of `norbelys_mail::dkim`, for the tests of the feedback intake.
norbelys-mail = { workspace = true, features = ["test-support"] }
tower.workspace = true
